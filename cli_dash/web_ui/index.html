<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/extensions.css" onerror="this.remove()">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon" id="app-icon">⚡</span>
                <h1 id="app-title">Control Center</h1>
            </div>
            <div class="header-actions">
                <div id="header-options"></div>
                <div class="status-indicator">
                    <span id="server-status" class="status-dot"></span>
                    <span id="status-text">Connected</span>
                </div>
            </div>
        </header>

        <nav class="tabs" id="tab-bar">
            <!-- Tabs populated dynamically -->
        </nav>

        <main>
            <div id="tab-views">
                <!-- Tab views populated dynamically -->
            </div>

            <div class="resizer" id="drag-resizer"></div>

            <section class="monitor" id="monitor-section">
                <div class="card console-card">
                    <div class="card-header">
                        <h2><span class="icon">💻</span> Live Console</h2>
                        <div id="active-job-id" class="active-job-id">Ready</div>
                    </div>
                    <div id="console" class="console">
                        <div class="placeholder">Select a task to see output...</div>
                    </div>
                </div>

                <div class="card history-card">
                    <div class="card-header">
                        <h2><span class="icon">📜</span> Job History</h2>
                        <div class="header-actions">
                            <div class="search-wrapper">
                                <input type="text" id="history-search" placeholder="Search command..."
                                    oninput="refreshHistory()">
                                <button id="clear-search" class="clear-btn" onclick="clearSearch()"
                                    style="display: none;">✕</button>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" id="show-cron" onchange="refreshHistory()"> Show Cron
                            </label>
                            <button class="icon-btn" onclick="resetFilters()" title="Reset Filters">↺</button>
                        </div>
                    </div>
                    <div class="history-list" id="history-list">
                        <!-- Jobs will be populated here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals container for extensions -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModals()">
        <div class="modal card" onclick="event.stopPropagation()">
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/extensions.js" onerror="this.remove()"></script>
</body>

</html>
