<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" id="favicon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="/static/extensions.css" onerror="this.remove()">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="app" class="app-container" v-cloak>
        <header style="flex-direction: column; align-items: stretch; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="logo">
                    <span class="icon" id="app-icon">{{ appConfig.icon || '⚡' }}</span>
                    <h1 id="app-title">{{ appConfig.title || 'Control Center' }}</h1>
                </div>
                <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
                    <div class="status-indicator" v-for="srv in mcpServers" :key="srv.name"
                        :title="'Port: ' + srv.port + (srv.pid ? ' | PID: ' + srv.pid : '') + (srv.status ? ' | Status: ' + srv.status : '')">
                        <span class="status-dot"
                            :style="{
                                backgroundColor: srv.status === 'healthy' ? 'var(--success-color)' : (srv.status === 'starting' ? 'var(--warning-color)' : 'var(--error-color)'),
                                boxShadow: '0 0 8px ' + (srv.status === 'healthy' ? 'var(--success-color)' : (srv.status === 'starting' ? 'var(--warning-color)' : 'var(--error-color)'))
                            }"></span>
                        <span>{{ srv.name }}</span>
                        <button class="icon-btn" @click="restartService(srv.name)" :title="srv.status === 'stopped' ? 'Start Service' : 'Restart Service'"
                            style="margin-left: 5px; cursor: pointer; padding: 2px;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14"
                                height="14">
                                <path
                                    d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />
                            </svg>
                        </button>
                    </div>
                    <div class="status-indicator">
                        <span id="server-status" class="status-dot"
                            :style="{ backgroundColor: connected ? 'var(--success-color)' : 'var(--error-color)', boxShadow: connected ? '0 0 8px var(--success-color)' : '0 0 8px var(--error-color)' }"></span>
                        <span id="status-text">{{ connected ? 'Connected' : 'Disconnected' }}</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px;">
                <div class="header-actions">
                    <div id="header-options">
                        <div class="option-toggle" v-for="opt in allHeaderOptions" :key="opt.id"
                            :class="{ active: headerState[opt.id] }" @click="toggleHeaderOption(opt.id)"
                            :title="opt.alt || opt.label || ''">
                            <span v-if="opt.icon && getOptionIcon(opt.icon)" v-html="getOptionIcon(opt.icon)"></span>
                            <span v-if="opt.label" class="toggle-label">{{ opt.label }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <nav class="tabs" id="tab-bar">
            <a v-for="tab in tabs" :key="tab.id" :href="'#' + tab.label" class="tab-link"
                :class="{ active: currentTab === tab.id }" @click="switchTab(tab)">
                {{ tab.label }}
            </a>
            <button class="help-tab-link" @click="showSearchModal" title="Search Logs (Ctrl/Cmd + Shift + F)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
            <button class="help-tab-link" @click="showHelpConsole" title="Help / Documentation">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path
                        d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z" />
                </svg>
            </button>
        </nav>

        <main :class="{ 'show-monitor': showMonitor, 'swiping': isSwiping }" @touchstart="onTouchStart"
            @touchmove="onTouchMove" @touchend="onTouchEnd">
            <div id="tab-views" :style="tabViewsStyle">
                <div class="view" style="display: block">
                    <component :is="activeTabComponent"></component>
                </div>
            </div>

            <div class="resizer" id="drag-resizer" @mousedown="startResize"></div>

            <section class="monitor" id="monitor-section" :style="monitorStyle">
                <div id="default-monitor" v-show="!monitorHidden" style="display: contents;">
                    <div class="card console-card">
                        <div class="card-header">
                            <h2><span class="icon">💻</span> Live Console</h2>
                            <div class="active-job-wrapper">
                                <div class="active-job-id">Viewing: {{ activeJobLabel }}</div>
                                <button class="close-btn" v-if="activeJobId && activeJob?.command" @click="copyCommand"
                                    title="Copy Command">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM5.5 7.5L4 9l3 3-3 3 1.5 1.5 4.5-4.5-4.5-4.5zM11 14h6v2h-6v-2z"/>
                                    </svg>
                                </button>
                                <button class="close-btn" v-if="activeJobId && activeJob?.log_path" @click="copyLogPath"
                                    title="Copy Log Path">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                                    </svg>
                                </button>
                                <button class="close-btn" v-if="activeJobId" @click="closeConsole"
                                    title="Close Console">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                        width="14" height="14">
                                        <path
                                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <!-- Rclone / custom progress hook -->
                        <component v-if="logComponent" :is="logComponent" :job="activeJob"
                            :log-content="consoleContent">
                        </component>
                        <log-viewer v-if="activeJobId" class="console" id="console" :content="consoleContent" :show-line-numbers="false" :inline-search="true" style="padding:0; border:none; background:transparent;"></log-viewer>
                        <div v-else class="console placeholder">Select a task to see output...</div>
                    </div>

                    <div class="card history-card">
                        <history-view></history-view>
                    </div>
                </div>

                <!-- Teleport target for custom tabs -->
                <div id="custom-monitor" v-show="monitorHidden" style="display: contents;"></div>
            </section>
        </main>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay" v-show="modal.show" @click.self="closeModal">
            <div class="modal card">
                <div v-if="modal.html" v-html="modal.html"></div>
                <component v-else-if="modal.component" :is="modal.component" v-bind="modal.props" @close="closeModal">
                </component>
            </div>
        </div>
    </div>

    <!-- Core Templates -->
    <script type="text/x-template" id="tpl-commands">
        <div class="controls">
            <div id="command-cards" style="display:contents">
                <template v-for="(cat, index) in commandCategories" :key="cat?.label || cat?.title || index">
                    <div class="card" v-if="cat">
                        <h2 v-if="cat.label || cat.title"><span class="icon" v-if="cat.icon">{{ cat.icon }}</span> {{ cat.title || cat.label }}</h2>
                    <template v-if="cat.commands">
                        <div class="button-group">
                            <div v-for="cmd in cat.commands" :key="cmd.command" class="command-row-entry" @click="filterHistory(cmd.command)">
                                <span class="command-label" :title="cmd.command">{{ cmd.label }}</span>
                                <div class="command-actions" @click.stop>
                                    <button class="action-btn play-btn" @click="runCommand(cmd.command, cmd.description || cmd.label, 0, 'command', null, cmd.env, cmd.job_exec)" title="Run without queue">▶</button>
                                    <div class="kebab-menu" v-if="normalizedQueues.length">
                                        <button class="icon-btn">⋮</button>
                                        <div class="dropdown-content">
                                            <div class="dropdown-item" v-for="q in normalizedQueues" :key="q.name" @click="runCommand(cmd.command, cmd.description || cmd.label, 0, 'command', q.name, cmd.env, cmd.job_exec)">
                                                Add to <span :style="{ color: q.color, fontWeight: 'bold' }">{{ q.name }}</span> Queue
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template v-else-if="cat.command">
                        <p v-if="cat.description" style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:15px">{{ cat.description }}</p>
                        <div class="command-row-entry" @click="filterHistory(cat.command)">
                            <span class="command-label" :title="cat.command">{{ cat.label }}</span>
                            <div class="command-actions" @click.stop>
                                <button class="action-btn play-btn" @click="runCommand(cat.command, cat.label, 0, 'command', null, cat.env, cat.job_exec)" title="Run without queue">▶</button>
                                <div class="kebab-menu" v-if="normalizedQueues.length">
                                    <button class="icon-btn">⋮</button>
                                    <div class="dropdown-content">
                                        <div class="dropdown-item" v-for="q in normalizedQueues" :key="q.name" @click="runCommand(cat.command, cat.label, 0, 'command', q.name, cat.env, cat.job_exec)">
                                            Add to <span :style="{ color: q.color, fontWeight: 'bold' }">{{ q.name }}</span> Queue
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    </div>
                </template>
            </div>
            <div class="card">
                <h2><span class="icon">⌨️</span> Custom Command</h2>
                <div class="custom-cmd-input">
                    <input type="text" v-model="customCmd" @keypress.enter="runCustom" list="command-presets" placeholder="e.g. my-script.py --flag">
                    <button @click="runCustom">Run</button>
                    <datalist id="command-presets">
                        <option v-for="opt in presets" :value="opt">{{ opt }}</option>
                    </datalist>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="tpl-scheduled">
        <div class="controls">
            <div class="card">
                <div class="card-header" style="flex-direction:column;align-items:stretch;gap:10px; border:none; padding:0; margin-bottom: 15px;">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <h2><span class="icon">📅</span> Cron Schedules</h2>
                        <div style="display:flex;gap:5px;">
                            <button class="icon-btn" @click="exportSchedules" title="Export to schedules.json">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                                </svg>
                            </button>
                            <button class="icon-btn" @click="importSchedules" title="Import from schedules.json (Overwrite)">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                                </svg>
                            </button>
                            <button class="icon-btn" @click="showNew = true" title="New Schedule">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="search-wrapper">
                        <input type="text" v-model="searchQuery" placeholder="Search schedules..." style="width:100%">
                        <button class="clear-btn" v-show="searchQuery" @click="searchQuery = ''" style="display:block">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="card form-card" v-if="showNew" style="margin-bottom:20px">
                    <h3>Add New Schedule</h3>
                    <div class="form-group">
                        <input type="text" v-model="newSched.label" placeholder="Label">
                        <input type="text" v-model="newSched.command" placeholder="Command">
                        <input type="text" v-model="newSched.cron_expr" placeholder="Cron (e.g. 0 10 * * *)">
                        <input type="text" v-model="newSched.queue" placeholder="Queue (optional)">
                    </div>
                    <div class="form-actions">
                        <button class="small-btn" @click="showNew = false">Cancel</button>
                        <button class="small-btn accent" @click="saveNew">Save</button>
                    </div>
                </div>
                <div class="schedule-list">
                    <div v-for="s in filteredSchedules" :key="s.id" class="schedule-item" :class="{ disabled: !s.enabled }">
                        <div class="catch-up-overlay" v-if="s.catch_up" title="Catch Up Enabled">⚡</div>
                        <div class="schedule-info" @click="editingId === s.id ? null : filterHistory(s.command)">
                            <div class="schedule-label">
                                <input v-if="editingId === s.id" type="text" v-model="editData.label" @keypress.enter="saveEdit(s.id)">
                                <template v-else>{{ s.label }}</template>
                            </div>
                            <div class="schedule-subtitle" v-if="s.enabled && s.next_run_iso">Next run: {{ formatNextRun(s) }}</div>
                            <div class="schedule-meta">
                                <template v-if="editingId === s.id">
                                    <input type="text" v-model="editData.cron_expr" @keypress.enter="saveEdit(s.id)" style="margin-bottom: 5px;">
                                    <input type="text" v-model="editData.queue" @keypress.enter="saveEdit(s.id)" style="margin-bottom: 5px;" placeholder="Queue (optional)">
                                    <input type="text" v-model="editData.command" @keypress.enter="saveEdit(s.id)">
                                </template>
                                <template v-else>
                                    {{ s.cron_expr }} • {{ s.command }}
                                    <span v-if="s.queue_name" class="cron-badge" :style="{ backgroundColor: getQueueColor(s.queue_name), marginLeft: '5px' }">{{ s.queue_name }}</span>
                                </template>
                            </div>
                        </div>
                        <div class="schedule-actions" @click.stop>
                            <button class="action-btn play-btn" @click="runSchedule(s)" title="Run Now">▶</button>
                            <div class="kebab-menu">
                                <button class="icon-btn">⋮</button>
                                <div class="dropdown-content">
                                    <div class="dropdown-item" @click="editingId === s.id ? saveEdit(s.id) : startEdit(s)">{{ editingId === s.id ? 'Save' : 'Edit' }}</div>
                                    <div class="dropdown-item" @click="toggleEnabled(s)">{{ s.enabled ? 'Deactivate' : 'Activate' }}</div>
                                    <div class="dropdown-item" @click="toggleCatchUp(s)">{{ s.catch_up ? 'Disable Catch Up' : 'Enable Catch Up' }}</div>
                                    <div class="dropdown-item warning" @click="deleteSchedule(s.id)">Delete</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script type="text/x-template" id="tpl-history">
        <div style="display:contents">
            <div class="card-header">
                <h2><span class="icon">📜</span> Job History</h2>
                <div class="header-actions">
                    <div class="search-wrapper">
                        <input type="text" v-model="searchQuery" placeholder="Search command...">
                        <button class="clear-btn" v-show="searchQuery" @click="searchQuery = ''" style="display:block">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>
                    <button class="option-toggle" :class="{ active: showCron }" @click="showCron = !showCron" title="Show Cron Jobs">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm-5-7h-3v3h3v-3z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" @click="resetFilters" title="Reset Filters">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="history-list" style="overflow-y:auto; flex:1" @scroll="onScroll">
                <div v-for="job in filteredJobs" :key="job.id" class="history-item" :class="{ 'cron-job': job.is_cron }" :title="job.command">
                    <div class="job-info" @click="showJob(job)">
                        <span class="job-time" style="min-width: 9.5rem;">{{ formatTime(job.created_at) }}</span>
                        <span class="job-duration" v-if="job.duration" style="font-size:0.8rem; color:var(--text-secondary); min-width: 3.4rem">{{ formatDuration(job.duration) }}</span>
                        <span class="job-cmd">{{ job.command }}</span>
                        <span v-if="job.is_cron" class="cron-badge">CRON</span>
                        <span v-else-if="job.job_source === 'exec'" class="cron-badge" style="background-color: var(--accent-color)">EXEC</span>
                        <span v-if="job.queue_name" class="cron-badge" :style="{ backgroundColor: getQueueColor(job.queue_name) }">{{ job.queue_name }}</span>
                        <span class="status-badge" :class="'status-' + job.status">{{ job.status }}</span>
                    </div>
                    <div class="job-actions">
                        <button class="action-job-btn rerun-btn" @click.stop="runJobAgain(job)" title="Rerun">▶</button>
                        <button v-if="job.status !== 'running'" class="action-job-btn delete-btn" @click.stop="deleteJob(job)" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                        <button v-else class="action-job-btn terminate-btn" @click.stop="terminateJob(job)" title="Terminate">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                <rect x="6" y="6" width="12" height="12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </script>
    <script type="text/x-template" id="tpl-log-search">
        <div class="search-modal-container">
            <div class="search-modal-top-bar">
                <span class="search-modal-title">Log Search</span>
                <div class="search-modal-actions">
                    <button class="icon-btn" @click="$emit('close')" title="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="search-modal-body">
                <div class="search-modal-sidebar" :style="{ width: searchState.sidebarWidth + '%' }">
                    <div class="search-modal-header">
                        <div class="search-modal-input-wrapper" style="position: relative; display: flex; align-items: center;">
                            <input type="text" v-model="searchState.query" @input="onInput" placeholder="Search logs..." ref="searchInput" class="search-modal-input" style="padding-right: 80px;" @keyup.esc="$emit('close')" @keydown.up.prevent="historyUp" @keydown.down.prevent="historyDown" @keydown.enter.prevent="onEnter">
                            <div class="search-toggles" style="position: absolute; right: 10px;">
                                <span :class="{'is-active': searchState.matchCase}" @click="searchState.matchCase = !searchState.matchCase; performSearch()" title="Match Case">Aa</span>
                                <span :class="{'is-active': searchState.matchWord}" @click="searchState.matchWord = !searchState.matchWord; performSearch()" title="Match Whole Word" style="text-decoration: underline; text-underline-offset: 2px;">ab</span>
                                <span :class="{'is-active': searchState.useRegex}" @click="searchState.useRegex = !searchState.useRegex; performSearch()" title="Use Regular Expression">.*</span>
                            </div>
                        </div>
                    </div>
                    <div class="search-modal-status" v-if="searchState.statusText">{{ searchState.statusText }}</div>
                    <div class="search-modal-results">
                        <div v-if="searchState.results.length === 0 && !searchState.isSearching && searchState.query" class="search-no-results">No matches found.</div>
                        <div v-for="res in searchState.results" :key="res.job_id" class="search-result-group">
                            <div class="search-result-job">
                                <span class="search-result-chevron">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                                    </svg>
                                </span>
                                <span class="search-result-terminal-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                        <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.9-2-2-2zm0 14H4V8h16v10zm-2-1h-6v-2h6v2zM7.5 17l-1.41-1.41L8.67 12l-2.58-3.59L7.5 7l4 5-4 5z"/>
                                    </svg>
                                </span>
                                <span class="search-result-job-cmd">{{ res.command }}</span>
                                <span class="search-result-job-date">[{{ formatTime(res.created_at) }}]</span>
                                <span class="search-result-job-id">{{ res.matches.length }}</span>
                            </div>
                            <div class="search-result-matches">
                                <div v-for="(match, idx) in res.matches" :key="idx" class="search-result-match" :class="{ active: searchState.selectedMatch && searchState.selectedMatch.jobId === res.job_id && searchState.selectedMatch.lineNumber === match.line_number }" @click="selectMatch(res.job_id, match.line_number)">
                                    <span class="search-result-match-chevron">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                                        </svg>
                                    </span>
                                    <span class="search-result-line-text" v-html="highlight(match.content)"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="search-resizer" @mousedown="startSearchResize"></div>
                <div class="search-modal-preview">
                    <div v-if="searchState.selectedMatch" class="preview-content" ref="previewContainer">
                        <div class="preview-navigator" v-if="matchNavigation && !searchState.previewLoading">
                            <span class="preview-nav-text">{{ matchNavigation.currentIndex }} of {{ matchNavigation.total }}</span>
                            <button class="preview-nav-btn" @click="prevMatch" title="Previous Match" :disabled="matchNavigation.currentIndex <= 1">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                    <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
                                </svg>
                            </button>
                            <button class="preview-nav-btn" @click="nextMatch" title="Next Match" :disabled="matchNavigation.currentIndex >= matchNavigation.total">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                    <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/>
                                </svg>
                            </button>
                        </div>
                        <div v-if="searchState.previewLoading" class="preview-loading">Loading preview...</div>
                        <log-viewer v-else :content="searchState.selectedMatch.fullLog" :search-query="searchState.query" :active-line="searchState.selectedMatch.lineNumber" :show-line-numbers="true"></log-viewer>
                    </div>
                    <div v-else class="preview-empty">Select a match to preview</div>
                </div>
            </div>
        </div>
    </script>
    
    <script type="text/x-template" id="tpl-log-viewer">
        <div class="log-viewer-container" style="position: relative; display: flex; flex-direction: column; height: 100%; flex: 1; overflow: hidden;">
            <div class="log-viewer-inline-search" v-show="showInlineSearchBox" :class="{'is-focused': isSearchFocused}">
                <div class="inline-search-input-wrapper">
                    <input type="text" ref="searchInputRef" v-model="localSearchQuery" placeholder="Find" class="inline-search-input" 
                        @keydown.esc="closeInlineSearch" 
                        @keydown.enter.prevent="onSearchEnter"
                        @focus="isSearchFocused = true" 
                        @blur="isSearchFocused = false">
                    
                    <div class="search-toggles">
                        <span :class="{'is-active': localMatchCase}" @click="localMatchCase = !localMatchCase" title="Match Case">Aa</span>
                        <span :class="{'is-active': localMatchWord}" @click="localMatchWord = !localMatchWord" title="Match Whole Word" style="text-decoration: underline; text-underline-offset: 2px;">ab</span>
                        <span :class="{'is-active': localUseRegex}" @click="localUseRegex = !localUseRegex" title="Use Regular Expression">.*</span>
                    </div>
                </div>

                <div class="search-results-info">
                    <span v-if="localSearchQuery && inlineMatches.length > 0">{{ currentInlineMatchIndex + 1 }} of {{ inlineMatches.length }}</span>
                    <span v-else-if="localSearchQuery" style="font-size: 0.75rem; letter-spacing: -0.2px;">No results</span>
                </div>
                
                <div class="search-nav-actions">
                    <button @click="prevInlineMatch" class="icon-btn" :disabled="!inlineMatches.length" title="Previous Match (Shift+Enter)">↑</button>
                    <button @click="nextInlineMatch" class="icon-btn" :disabled="!inlineMatches.length" title="Next Match (Enter)">↓</button>
                    <button @click="closeInlineSearch" class="icon-btn" title="Close (Esc)">✕</button>
                </div>
            </div>
            <div class="log-viewer" ref="viewerRef">
                <div v-if="parsedLines.length === 0" class="placeholder">No output captured.</div>
                <div v-else class="preview-lines">
                    <div v-for="line in parsedLines" :key="line.number" class="preview-line" :class="{ 'preview-line-active': activeLine === line.number }" :id="'lv-line-' + line.number">
                        <span v-if="showLineNumbers" class="preview-line-num">{{ line.number }}</span>
                        <span class="preview-line-text" v-html="line.html" style="white-space: inherit;"></span>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- App script + extensions loader -->
    <script src="/static/app.js"></script>
    <script>
        fetch('/static/templates.html').then(r => {
            if (r.ok) return r.text();
            return '';
        }).then(html => {
            if (html) {
                const div = document.createElement('div');
                div.style.display = 'none';
                div.innerHTML = html;
                document.body.appendChild(div);
            }
            const script = document.createElement('script');
            script.src = '/static/extensions.js';
            script.onerror = () => {
                // Initialize Vue app even if extensions.js is missing
                window.initVueApp();
            };
            script.onload = () => {
                // Initialize Vue app after extensions.js is loaded
                if (window.initVueApp) window.initVueApp();
            };
            document.body.appendChild(script);
        });
    </script>
</body>

</html>
